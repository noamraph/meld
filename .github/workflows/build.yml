name: Build Distribution Files

on:
  push:
    branches: [ fourdiff-pypi ]
  pull_request:
    branches: [ fourdiff-pypi ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      # Latest right now, based on ubuntu 24.04
      image: condaforge/miniforge3:26.1.1-3

    # defaults:
    #   run:
    #     shell: bash -l {0}     # Important for conda to work properly

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # - name: prepare for ssh debug
      #   run: |
      #     apt-get update && apt-get install -y --no-install-recommends tmux openssh-client

      # - name: upterm ssh debug
      #   uses: owenthereal/action-upterm@v1

      - name: Build the files
        run: bundler/bundler.py --workdir work

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: built-files
          path: dist/
          retention-days: 7

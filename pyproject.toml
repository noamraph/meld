[build-system]
build-backend = "mesonpy"
requires = [
    "meson-python == 0.19.0",
    # We currently depend on this PR to meson: https://github.com/mesonbuild/meson/pull/15494
    # Once it's released, we should set this to the released version.
    "meson @ git+https://github.com/dnicolodi/meson.git@i18n-install-dir",
]

[project]
name = "meld-fourdiff"
dynamic = ["version"]
license = {file = "COPYING"}
description = """
A repackaged version of Meld, including the Fourdiff feature.
"""

maintainers = [
    {name = "Noam Raphael", email = "noamraph@gmail.com"},
]
requires-python = ">=3.10"
dependencies = [
    "pycairo==1.29.0",
    "pygobject==3.38.0",
]
readme = "README.md"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Desktop Environment :: Gnome",
    "Topic :: Software Development",
    "Topic :: Software Development :: Version Control",
]
keywords=[
    "diff",
    "merge",
]

[project.urls]
homepage = "https://github.com/noamraph/meld/"

[tool.meson-python.args]
setup = ['-Dis_wheel=true']

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = [
    "meld",
]
no-lines-before = [
    "local-folder",
]
order-by-type = true
